workflows:
  ios-app-store-production:
    name: Ohati iOS App Store & TestFlight Production Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: ohati_app_store_connect_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ohati.app
      vars:
        BUNDLE_ID: "com.ohati.app"
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install npm dependencies & Initialize iOS project
        script: |
          npm install
          chmod -R +x node_modules/.bin || true
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "Generating fresh native iOS Xcode project..."
            rm -rf ios
            npx @capacitor/cli add ios
          fi
          if [ -f "ios_templates/Info.plist" ]; then
            echo "Applying App Store Privacy Permissions to Info.plist..."
            cp ios_templates/Info.plist ios/App/App/Info.plist
          fi
          if [ -f "ios_templates/PrivacyInfo.xcprivacy" ]; then
            echo "Applying Apple Privacy Manifest PrivacyInfo.xcprivacy..."
            cp ios_templates/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          fi
          if [ -d "ios_templates/Assets.xcassets/AppIcon.appiconset" ]; then
            echo "Applying official Ohati App Icon to Xcode Assets..."
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp -r ios_templates/Assets.xcassets/AppIcon.appiconset/* ios/App/App/Assets.xcassets/AppIcon.appiconset/
          fi
          npx @capacitor/cli sync ios
          echo "Setting minimum iOS deployment target to 15.0..."
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} + 2>/dev/null || find ios -name "project.pbxproj" -exec sed -i 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} + 2>/dev/null || true
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing & apply provisioning profile
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --project "ios/App/App.xcodeproj"
      - name: Auto-increment iOS Build Number from App Store Connect
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number --bundle-id "$BUNDLE_ID" 2>/dev/null || echo 3)
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" -lt 3 ]; then
            LATEST_BUILD_NUMBER=3
          fi
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          
          # If Codemagic $BUILD_NUMBER is higher, use it
          CM_COUNTER=${BUILD_NUMBER:-1}
          if [ "$CM_COUNTER" -ge "$NEW_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER=$((CM_COUNTER + 1))
          fi
          
          echo "Setting iOS Build Number to: $NEW_BUILD_NUMBER"
          
          # Set CFBundleVersion directly in Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEW_BUILD_NUMBER" ios/App/App/Info.plist
          
          # Update agvtool in Xcode project
          cd ios/App && agvtool new-version -all $NEW_BUILD_NUMBER || true
      - name: Build and Export Signed IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-adhoc-testing:
    name: Ohati iOS Ad-Hoc Internal Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies & Initialize iOS project
        script: |
          npm install
          chmod -R +x node_modules/.bin || true
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "Generating fresh native iOS Xcode project..."
            rm -rf ios
            npx @capacitor/cli add ios
          fi
          if [ -f "ios_templates/Info.plist" ]; then
            cp ios_templates/Info.plist ios/App/App/Info.plist
          fi
          if [ -d "ios_templates/Assets.xcassets/AppIcon.appiconset" ]; then
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp -r ios_templates/Assets.xcassets/AppIcon.appiconset/* ios/App/App/Assets.xcassets/AppIcon.appiconset/
          fi
          npx @capacitor/cli sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Build iOS Archive & Workspace
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath build/ios/App.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     archive
          mkdir -p build/ios/export
          zip -r build/ios/export/Ohati-iOS-Native-Project.zip ios/App
    artifacts:
      - build/ios/export/*.zip
      - build/ios/App.xcarchive
      - ios/App/App.xcworkspace

  android-google-play-production:
    name: Ohati Android Google Play Production Build (.aab & .apk)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install npm dependencies & Initialize Android project
        script: |
          npm install
          chmod -R +x node_modules/.bin || true
          if [ ! -d "android" ]; then
            echo "Generating fresh native Android project..."
            npx @capacitor/cli add android
          fi
          sed -i '' 's/targetSdkVersion = 34/targetSdkVersion = 36/g' android/variables.gradle 2>/dev/null || sed -i 's/targetSdkVersion = 34/targetSdkVersion = 36/g' android/variables.gradle 2>/dev/null || true
          sed -i '' 's/compileSdkVersion = 34/compileSdkVersion = 36/g' android/variables.gradle 2>/dev/null || sed -i 's/compileSdkVersion = 34/compileSdkVersion = 36/g' android/variables.gradle 2>/dev/null || true
          npx @capacitor/cli sync android
      - name: Generate Release Keystore & Build Signed Android AAB Bundle
        script: |
          cd android
          chmod +x gradlew
          if [ ! -f "app/ohati-release-key.jks" ]; then
            echo "Generating production release keystore for Google Play..."
            keytool -genkeypair -v \
              -keystore app/ohati-release-key.jks \
              -alias ohati-key-alias \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass OhatiRelease2026@Key \
              -keypass OhatiRelease2026@Key \
              -dname "CN=Ohati Event Marketplace, OU=Mobile, O=Ohati Inc, L=Accra, S=Greater Accra, C=GH"
          fi
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
