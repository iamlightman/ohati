workflows:
  ios-capacitor-workflow:
    name: Ohati iOS App Store Signed Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: ad_hoc # Options: app_store, ad_hoc, development, enterprise
        bundle_identifier: com.ohati.app
      node: 20.x
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Capacitor web assets to iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up build directory
        script: |
          mkdir -p build/ios/ipa
      - name: Build iOS Archive
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath build/ios/App.xcarchive \
                     archive
      - name: Export Signed IPA
        script: |
          xcodebuild -exportArchive \
                     -archivePath build/ios/App.xcarchive \
                     -exportOptionsPlist ios/App/App/ExportOptions.plist \
                     -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/App.xcarchive
      - ios/App/App.xcworkspace
