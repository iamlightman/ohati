workflows:
  ios-app-store-production:
    name: Ohati iOS App Store & TestFlight Production Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: ohati_app_store_connect_key
    environment:
      vars:
        BUNDLE_ID: "com.ohati.app"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies & Initialize iOS project
        script: |
          npm install
          chmod -R +x node_modules/.bin || true
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "Generating fresh native iOS Xcode project..."
            rm -rf ios
            npx @capacitor/cli add ios
          fi
          if [ -f "ios_templates/Info.plist" ]; then
            echo "Applying App Store Privacy Permissions to Info.plist..."
            cp ios_templates/Info.plist ios/App/App/Info.plist
          fi
          npx @capacitor/cli sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing & extract Apple credentials
        script: |
          keychain initialize
          keychain add-certificates || true
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE || true
          cd ios/App && xcode-project use-profiles || true
      - name: Auto-increment iOS Build Number from App Store Connect
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number --bundle-id "$BUNDLE_ID" || echo 1)
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          cd ios/App && agvtool new-version -all $NEW_BUILD_NUMBER
          echo "Updated iOS Build Number to: $NEW_BUILD_NUMBER"
      - name: Build and Export Signed IPA for App Store
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH=$(find "$PROFILES_HOME" -name "*.mobileprovision" | head -n 1)
          
          # Extract metadata from provisioning profile
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          
          echo "Apple Team ID: $TEAM_ID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

          # Dynamically create ExportOptions.plist with exact Team ID and Provisioning Profile
          cat <<EOF > /tmp/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_UUID</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          mkdir -p build/ios/ipa
          
          # Build Archive with explicit Team ID and Profile Specifier
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath build/ios/App.xcarchive \
                     archive \
                     DEVELOPMENT_TEAM="$TEAM_ID" \
                     PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     CODE_SIGN_STYLE="Manual"

          # Export signed IPA
          xcodebuild -exportArchive \
                     -archivePath build/ios/App.xcarchive \
                     -exportOptionsPlist /tmp/ExportOptions.plist \
                     -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/App.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-adhoc-testing:
    name: Ohati iOS Ad-Hoc Internal Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies & Initialize iOS project
        script: |
          npm install
          chmod -R +x node_modules/.bin || true
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "Generating fresh native iOS Xcode project..."
            rm -rf ios
            npx @capacitor/cli add ios
          fi
          if [ -f "ios_templates/Info.plist" ]; then
            cp ios_templates/Info.plist ios/App/App/Info.plist
          fi
          npx @capacitor/cli sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Build iOS Archive & Workspace
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath build/ios/App.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     archive
    artifacts:
      - build/ios/App.xcarchive
      - ios/App/App.xcworkspace
